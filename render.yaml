services:
  # Arogya AI FastAPI Backend Web Service
  - type: web
    name: arogyaai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGIN_REGEX
        value: ^https:\/\/.*\.vercel\.app$
      - key: BUSINESS_REFERENCE_DATE
        value: "2026-11-16"
      - key: AI_PROVIDER
        value: ollama
      - key: AI_BASE_URL
        value: http://localhost:11434/v1
      - key: AI_MODEL
        value: qwen2.5-coder:7b
      # Set DATABASE_URL if connecting to managed PostgreSQL
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: arogyaai-postgres
      #     property: connectionString

# Optional: Add managed PostgreSQL database if persistence beyond container restart is required
# databases:
#   - name: arogyaai-postgres
#     databaseName: arogya_db
#     user: arogya_user
#     plan: free
